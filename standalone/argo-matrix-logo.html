<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Tech · logo Matrix</title>
<!--
  ARGO / One Tech · logo in caratteri Matrix con i flussi di codice verso la linea
  (l'animazione di "Chi siamo") — file unico, senza framework, logo incluso nel file.

  COME USARLO SU UN ALTRO SITO
  1. Copia i tre tag link del carattere DM Mono (qui sotto) nell'head della tua pagina.
  2. Copia il blocco style con id "argo-mx-css" nell'head (tutti i nomi iniziano con "argo-mx":
     non tocca gli altri stili del sito).
  3. Metti il riquadro dove vuoi:   div class="argo-mx"  (vedi il body qui sotto).
     Prende tutta la larghezza e l'altezza del suo contenitore (minimo 320px di altezza).
     Su spazi larghi il codice scorre verso la linea a sinistra; sotto i 560px di larghezza
     il logo sta sopra e il codice scende verso la linea in basso.
     Opzioni: data-line="off" nasconde la linea · data-label="..." testo per i lettori di schermo.
  4. Copia lo script con id "argo-mx-js" prima della chiusura del body.
  Sta bene su fondo scuro (#07110c, il verde-nero di ARGO).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style id="argo-mx-css">
/* scudo: gli stili generici del sito ospite non entrano nel riquadro (sta prima delle regole sotto) */
.argo-mx,.argo-mx *{all:revert;box-sizing:border-box}
.argo-mx{position:relative;display:block;width:100%;height:100%;min-height:320px;overflow:hidden;isolation:isolate;font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* dimensioni bloccate: nemmeno regole "!important" del sito ospite sui canvas le cambiano */
.argo-mx-canvas{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important}
/* la linea dove arriva il codice: verticale a sinistra, oppure orizzontale in basso su spazi stretti */
.argo-mx-line{position:absolute;z-index:1;top:0;bottom:0;left:0;width:1px;background:linear-gradient(180deg,transparent,#2fbf72 14%,#2fbf72 86%,transparent);box-shadow:0 0 12px rgba(47,191,114,.7),0 0 34px rgba(47,191,114,.35);transform:scaleY(0);transform-origin:top;transition:transform 1.1s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.argo-mx.is-stacked .argo-mx-line{top:auto;right:0;bottom:0;width:auto;height:1px;background:linear-gradient(90deg,transparent,#2fbf72 14%,#2fbf72 86%,transparent);transform:scaleX(0);transform-origin:left}
.argo-mx.is-on .argo-mx-line{transform:none}
.argo-mx[data-line=off] .argo-mx-line{display:none}
@media (prefers-reduced-motion:reduce){
.argo-mx-line{transition:none}
}
</style>

<!-- solo per questa anteprima: un riquadro come "Chi siamo" (sul tuo sito non serve) -->
<style>
html,body{margin:0;background:#0b120e}
body{display:grid;place-items:center;min-height:100vh;padding:24px 16px;box-sizing:border-box}
.demo{width:min(900px,100%);height:min(560px,80vh);border:1px solid #1d2b23;background:radial-gradient(ellipse 60% 60% at 70% 50%,rgba(31,157,90,.2),transparent 70%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/28px 28px,#07110c}
</style>
</head>
<body>

<div class="demo">
  <div class="argo-mx" data-label="One Tech"></div>
</div>

  var GLYPHS = "01".repeat(14) + "ABCDEFGHIJKLMNOPQRSTUVWXYZ";   /* binario + alfabeto */
  var CELL = 11;        /* lato della cella in px */
  var ASSEMBLE = 1.6;   /* secondi per comporre il logo */
  var FPS = 30;
  var NARROW = 560;     /* sotto questa larghezza: logo sopra, codice verso la linea in basso */
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
  var rnd = function () { return GLYPHS[(Math.random() * GLYPHS.length) | 0]; };

  var img = new Image();
  var loaded = new Promise(function (ok) { img.onload = ok; });
  img.src = MARK;

  function start(box) {
    box.setAttribute("role", "img");
    box.setAttribute("aria-label", box.getAttribute("data-label") || "One Tech");
    box.textContent = "";
    var line = document.createElement("span"); line.className = "argo-mx-line"; line.setAttribute("aria-hidden", "true");
    var canvas = document.createElement("canvas"); canvas.className = "argo-mx-canvas"; canvas.setAttribute("aria-hidden", "true");
    box.appendChild(canvas); box.appendChild(line);
    var ctx = canvas.getContext("2d");
    var font = getComputedStyle(box).fontFamily;
    var w = 0, h = 0, down = false, cells = [], sources = [], streams = [], hits = [];
    var raf = 0, last = 0, t0 = -1, visible = false, ready = false;

    /* campiona il marchio su una griglia: ogni cella piena diventa un carattere */
    function build() {
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      down = w < NARROW;
      box.classList.toggle("is-stacked", down);
      if (!img.naturalWidth) return;
      var size = Math.min(w * (down ? 0.62 : 0.56), h * (down ? 0.7 : 0.72));
      var cols = Math.floor(size / CELL), rows = Math.round((cols * img.naturalHeight) / img.naturalWidth);
      if (cols < 4 || rows < 4) { ready = false; cells = []; sources = []; streams = []; hits = []; return; }
      var ox = down ? (w - cols * CELL) / 2 : w - cols * CELL - w * 0.1;
      var oy = down ? h * 0.08 : (h - rows * CELL) / 2;

      var probe = document.createElement("canvas");
      probe.width = cols; probe.height = rows;
      var pc = probe.getContext("2d", { willReadFrequently: true });
      pc.drawImage(img, 0, 0, cols, rows);
      var data = pc.getImageData(0, 0, cols, rows).data;

      cells = []; sources = [];
      var edge = []; for (var e = 0; e < (down ? cols : rows); e++) edge.push(-1);
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          if (data[(r * cols + c) * 4 + 3] < 110) continue;
          var x = ox + c * CELL, y = oy + r * CELL;
          cells.push({ x: x, y: y, ch: rnd(), at: Math.random() * ASSEMBLE * 0.75 + (down ? r / rows : 1 - c / cols) * ASSEMBLE * 0.25, hi: Math.random() });
          /* da qui partono i flussi: la cella più a sinistra di ogni riga (o più in basso di ogni colonna) */
          if (down) edge[c] = Math.max(edge[c], y); else if (edge[r] < 0 || x < edge[r]) edge[r] = x;
        }
      }
      edge.forEach(function (v, k) {
        if (v < 0) return;
        sources.push(down ? { x: ox + k * CELL, y: v + CELL } : { x: v - CELL, y: oy + k * CELL });
      });
      streams = []; hits = [];
      ready = true;
    }

    function spawn() {
      var s = sources[(Math.random() * sources.length) | 0], trail = [];
      for (var k = 0; k < 14; k++) trail.push(rnd());
      return { x: s.x, y: s.y, v: 140 + Math.random() * 220, len: 5 + ((Math.random() * 9) | 0), trail: trail };
    }

    function draw(time, dt) {
      ctx.clearRect(0, 0, w, h);
      ctx.font = (CELL - 1) + "px " + font;
      ctx.textBaseline = "top";
      var age = reduce ? 99 : time - t0;

      /* il logo: i caratteri cadono e si fermano nelle celle */
      cells.forEach(function (c) {
        var p = Math.min(1, Math.max(0, (age - c.at) / 0.45));
        if (p <= 0) return;
        if (Math.random() < (p < 1 ? 0.5 : 0.035)) c.ch = rnd();
        var e = 1 - Math.pow(1 - p, 3);
        var settled = p >= 1;
        ctx.globalAlpha = settled ? 0.55 + c.hi * 0.45 : e;
        ctx.fillStyle = !settled ? "#e9fff1" : c.hi > 0.93 ? "#d4f25a" : c.hi > 0.6 ? "#7fe0a8" : "#1f9d5a";
        ctx.fillText(c.ch, c.x, c.y - (1 - e) * 90);
      });
      ctx.globalAlpha = 1;

      /* i flussi di codice verso la linea */
      if (!reduce && age > ASSEMBLE * 0.8 && sources.length) {
        var want = down ? 8 : 22;
        while (streams.length < want && Math.random() < 0.35) streams.push(spawn());
        streams = streams.filter(function (s) {
          if (down) s.y += s.v * dt; else s.x -= s.v * dt;
          if (Math.random() < 0.3) s.trail[(Math.random() * s.trail.length) | 0] = rnd();
          for (var k = 0; k < s.len; k++) {
            var x = down ? s.x : s.x + k * CELL, y = down ? s.y - k * CELL : s.y;
            if (down ? y > h - 2 : x < 2) continue;
            ctx.globalAlpha = (1 - k / s.len) * 0.9;
            ctx.fillStyle = k === 0 ? "#e9fff1" : "#2fbf72";
            ctx.fillText(s.trail[k], x, y);
          }
          var arrived = down ? s.y >= h - CELL : s.x <= 0;
          if (arrived) hits.push({ pos: down ? s.x + CELL / 2 : s.y + CELL / 2, life: 1 });
          return !arrived;
        });
        ctx.globalAlpha = 1;
      }

      /* lampi dove il codice tocca la linea */
      hits = hits.filter(function (hit) {
        hit.life -= dt * 2.2;
        if (hit.life <= 0) return false;
        var g = down ? ctx.createRadialGradient(hit.pos, h, 0, hit.pos, h, 26) : ctx.createRadialGradient(0, hit.pos, 0, 0, hit.pos, 26);
        g.addColorStop(0, "rgba(201,247,220," + 0.85 * hit.life + ")");
        g.addColorStop(1, "rgba(47,191,114,0)");
        ctx.fillStyle = g;
        if (down) ctx.fillRect(hit.pos - 26, h - 26, 52, 26); else ctx.fillRect(0, hit.pos - 26, 26, 52);
        return true;
      });
    }

    function loop(now) {
      raf = requestAnimationFrame(loop);
      if (now - last < 1000 / FPS) return;
      var dt = Math.min(0.1, (now - last) / 1000 || 0);
      last = now;
      if (t0 < 0) t0 = now / 1000;
      if (ready) draw(now / 1000, dt);
    }
    function play() {
      cancelAnimationFrame(raf);
      if (reduce) { if (ready) draw(0, 0); return; }
      if (visible && !document.hidden) raf = requestAnimationFrame(loop);
    }

    build();
    new ResizeObserver(function () { build(); if (reduce && ready) draw(0, 0); }).observe(canvas);
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      if (visible) box.classList.add("is-on");   /* la linea si disegna la prima volta che si vede */
      play();
    }, { threshold: 0.2 }).observe(box);
    document.addEventListener("visibilitychange", play);
  }

  function init() {
    loaded.then(function () {
      document.querySelectorAll(".argo-mx:not([data-argo-ready])").forEach(function (b) { b.setAttribute("data-argo-ready", ""); start(b); });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
