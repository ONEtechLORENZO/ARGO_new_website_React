<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b120e">
<meta name="color-scheme" content="dark">
<title>Accedi | ARGO · One Tech</title>
<meta name="description" content="Accedi al tuo account ARGO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  ARGO · pagina di accesso — file unico, senza framework (HTML + CSS + JavaScript).
  Si usa così com'è su qualsiasi sito. Da configurare (in fondo, nello <script>):
    SITE_URL        indirizzo del sito ARGO (link "Torna al sito" e "Parla con noi")
    LOGIN_ENDPOINT  indirizzo che verifica email e password (POST JSON { email, password },
                    risposta { ok: true, redirect: "..." } oppure 401). Vuoto = mostra
                    "accesso non ancora attivo".
    SUPPORT_EMAIL   indirizzo per "Password dimenticata?"
  La lingua si cambia con IT | EN in alto (oppure <html lang="en"> per partire in inglese).
-->
<style>
:root{--bg:#0b120e;--ink:#e3ede7;--muted:#93a69b;--line:#223229;--paper:#111b16;--green:#1f9d5a;--green-dark:#16884f;--amber:#f0b73c;--gutter:5vw}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
a,button{-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:5px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* pagina */
.login{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:84px 16px 40px;background:radial-gradient(ellipse 70% 60% at 50% 48%,rgba(20,90,40,.28),transparent 70%),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}

/* barra in alto: torna al sito · IT | EN */
.lg-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px var(--gutter)}
.lg-back{display:inline-flex;align-items:center;gap:8px;padding:10px 0;font-size:13px;color:var(--muted);transition:color .2s ease}
.lg-back span{transition:transform .2s ease}
.lg-back:hover{color:var(--ink)}
.lg-back:hover span{transform:translateX(-3px)}
.lg-lang{display:inline-flex;border:1px solid var(--line);background:var(--paper)}
.lg-lang button{display:grid;place-items:center;min-width:38px;height:40px;padding:0 10px;border:0;background:none;font-size:12px;letter-spacing:.08em;color:var(--muted);transition:color .2s ease,background .2s ease}
.lg-lang button + button{border-left:1px solid var(--line)}
.lg-lang button:hover{color:var(--ink);background:#18241d}
.lg-lang button[aria-pressed=true]{background:var(--ink);color:var(--paper);cursor:default}

/* riquadro nero con il pannello verde dentro */
.lg-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:min(1000px,100%);min-height:min(560px,calc(100svh - 140px));padding:14px;background:#020403;border:1px solid #1d2b23;box-shadow:0 50px 120px -40px rgba(0,0,0,.9),0 0 0 1px rgba(47,191,114,.05) inset;animation:lgIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes lgIn{from{opacity:0;transform:translateY(18px)}}

/* pannello sinistro: pioggia Matrix e logo */
.lg-side{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:48px 32px;background:#07110c;border:1px solid rgba(47,191,114,.18)}
.lg-rain{position:absolute;inset:0;z-index:-2;width:100%;height:100%;opacity:.75;-webkit-mask-image:radial-gradient(ellipse 46% 30% at 50% 50%,rgba(0,0,0,.25) 0,#000 100%);mask-image:radial-gradient(ellipse 46% 30% at 50% 50%,rgba(0,0,0,.25) 0,#000 100%)}
.lg-side::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 50% 32% at 50% 50%,rgba(31,157,90,.28),transparent 70%);pointer-events:none}
.lg-logo{display:block;width:min(330px,82%)}
.lg-logo svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(47,191,114,.35))}
.lg-l{fill:#2fbf72;transition:fill .3s ease}.lg-d{fill:#1f9d5a}
.lg-logo:hover .lg-l{fill:#5fd394}
.lg-logo:focus-visible{outline-color:#5fd394}
.lg-panel{margin:0;font-size:12px;letter-spacing:.06em;color:#c9dccf;text-align:center;text-shadow:0 0 4px #07110c,0 0 10px #07110c,0 0 18px #07110c}

/* riquadro "scanner" sotto il logo (components/ScanBox.tsx): un documento letto dal raggio verde */
.scan{width:min(340px,92%);margin-top:8px;border:1px solid rgba(47,191,114,.32);background:rgba(2,8,5,.78);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:0 0 0 1px rgba(47,191,114,.06) inset,0 24px 50px -24px rgba(0,0,0,.9);font-size:11px;color:var(--ink)}
.scan-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(47,191,114,.18);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9fe8bd}
.scan-dot{width:6px;height:6px;border-radius:50%;background:#2fbf72;box-shadow:0 0 8px #2fbf72;animation:scanBlink 1.1s steps(2,start) infinite}
.scan-count{margin-left:auto;letter-spacing:.08em;color:#5f7469}
@keyframes scanBlink{to{opacity:.2}}
.scan-body{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;padding:14px 14px 16px}

/* il foglio con gli angoli del mirino */
.scan-doc{position:relative;padding:7px}
.scan-c{position:absolute;width:11px;height:11px;border-color:#2fbf72;border-style:solid;filter:drop-shadow(0 0 4px rgba(47,191,114,.7));animation:scanLock .5s cubic-bezier(.2,.7,.2,1) both}
.scan-c.tl{top:0;left:0;border-width:2px 0 0 2px}
.scan-c.tr{top:0;right:0;border-width:2px 2px 0 0}
.scan-c.bl{bottom:0;left:0;border-width:0 0 2px 2px}
.scan-c.br{bottom:0;right:0;border-width:0 2px 2px 0}
@keyframes scanLock{from{opacity:0;transform:scale(1.6)}}
.scan-paper{position:relative;overflow:hidden;padding:8px 8px 10px;background:#0d1511;border:1px solid #2c3d34}
.scan-paper b{display:block;font-weight:500;font-size:7.5px;line-height:1.3;letter-spacing:.05em;text-transform:uppercase;overflow-wrap:break-word;color:#5fd394}
.scan-line{display:block;height:3px;margin-top:7px;background:#24352c;animation:scanLit .3s ease forwards;animation-delay:calc(.35s + var(--k)*.22s)}
@keyframes scanLit{to{background:#2fbf72;box-shadow:0 0 6px rgba(47,191,114,.6)}}
/* il raggio: una riga luminosa con la scia sopra */
.scan-beam{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#c9f7dc 20%,#c9f7dc 80%,transparent);box-shadow:0 0 10px 2px rgba(47,191,114,.75);animation:scanBeam 1.8s cubic-bezier(.45,0,.55,1) .2s both}
.scan-beam::before{content:"";position:absolute;left:0;right:0;bottom:2px;height:26px;background:linear-gradient(to bottom,transparent,rgba(47,191,114,.22))}
@keyframes scanBeam{0%{top:0;opacity:0}8%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}

/* i campi letti, uno alla volta, come se venissero digitati */
.scan-fields{display:flex;flex-direction:column;gap:8px;min-width:0;margin:0}
.scan-fields div{min-width:0;opacity:0;animation:scanIn .35s ease forwards;animation-delay:calc(.8s + var(--n)*.45s)}
.scan-fields dt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#5f7469}
.scan-fields dd{margin:2px 0 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:#e3ede7;clip-path:inset(0 100% 0 0);animation:scanType .6s steps(16,end) forwards;animation-delay:calc(.9s + var(--n)*.45s)}
@keyframes scanIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes scanType{to{clip-path:inset(0)}}
.scan-ok{align-self:flex-start;margin:2px 0 0;padding:3px 9px;border:1px solid rgba(47,191,114,.5);background:rgba(47,191,114,.1);font-size:10px;letter-spacing:.06em;color:#5fd394;opacity:0;animation:scanIn .35s ease 2.4s forwards}

/* modulo */
.lg-main{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4.5vw,60px)}
.lg-main h1{margin:0;font-weight:500;font-size:clamp(32px,3.4vw,48px);line-height:1.02;letter-spacing:-.06em;color:var(--ink)}
.lg-sub{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.lg-form{display:flex;flex-direction:column;gap:18px;margin-top:30px}
.lg-field{display:flex;flex-direction:column;gap:8px}
.lg-field label{font-size:13px;font-weight:500;color:var(--ink)}
.lg-field input{width:100%;padding:13px 14px;border:1px solid #2c3d34;border-radius:0;background:#0d1511;color:var(--ink);font:inherit;font-size:14px;letter-spacing:-.01em;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
.lg-field input::placeholder{color:#5f7469}
.lg-field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(31,157,90,.2)}
.lg-field input[aria-invalid=true]{border-color:#ff7b7b}
.lg-field input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 40px #0d1511 inset;caret-color:var(--ink)}
.lg-pass{position:relative}
.lg-pass input{padding-right:50px}
.lg-eye{position:absolute;top:0;right:0;bottom:0;display:grid;place-items:center;width:46px;padding:0;border:0;background:none;color:var(--muted);transition:color .2s ease}
.lg-eye svg{width:19px;height:19px}
.lg-eye:hover{color:var(--ink)}
.lg-eye:focus-visible{outline-offset:-4px}
.lg-eye .slash{display:block}
.lg-eye[aria-pressed=true] .slash{display:none}
.lg-err{margin:0;font-size:12px;line-height:1.5;color:#ff7b7b;animation:errIn .25s ease}
.lg-err[hidden]{display:none}
@keyframes errIn{from{opacity:0;transform:translateY(-3px)}}
.lg-forgot{align-self:flex-end;margin-top:-6px;padding:4px 0;font-size:12px;color:#5fd394;border-bottom:1px solid rgba(95,211,148,.35)}
.lg-forgot:hover{border-color:#5fd394}
.lg-msg{margin:0;padding:12px 14px;border:1px solid rgba(240,183,60,.4);border-left:3px solid var(--amber);background:rgba(240,183,60,.08);font-size:12.5px;line-height:1.6;color:#f3d38c;animation:errIn .25s ease}
.lg-msg[hidden]{display:none}
.lg-submit{display:inline-flex;justify-content:center;align-items:center;gap:8px;margin-top:4px;padding:14px 20px;border:1px solid var(--green-dark);border-radius:0;background:var(--green-dark);color:#fbfdfb;font-size:14px;transition:background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.lg-submit svg{width:16px;height:16px;transition:transform .2s ease}
.lg-submit:hover{background:#127443;border-color:#127443;transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(22,136,79,.7)}
.lg-submit:hover svg{transform:translateX(3px)}
.lg-submit:disabled{opacity:.7;cursor:progress;transform:none}
.lg-alt{margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.lg-alt a{color:#5fd394;border-bottom:1px solid rgba(95,211,148,.35)}
.lg-alt a:hover{border-color:#5fd394}

@media (max-width:760px){
:root{--gutter:16px}
.login{padding:76px 12px 28px;place-items:start center}
.lg-card{grid-template-columns:minmax(0,1fr);min-height:0;padding:10px}
.lg-side{padding:34px 20px;gap:14px}
.lg-logo{width:min(220px,70%)}
.lg-main{padding:28px 16px 22px}
.scan{width:100%;margin-top:2px}
.scan-body{grid-template-columns:84px minmax(0,1fr);gap:14px;padding:12px}
}
@media (prefers-reduced-motion:reduce){
.lg-card,.lg-err,.lg-msg,.scan-dot,.scan-c{animation:none}
.scan-line{animation:none;background:#2fbf72}
.scan-beam{display:none}
.scan-fields div,.scan-ok{animation:none;opacity:1}
.scan-fields dd{animation:none;clip-path:none}
.lg-submit,.lg-submit svg,.lg-back span,.lg-field input,.lg-l{transition:none}
}
</style>
</head>
<body>
<main class="login" id="contenuto">
  <div class="lg-top">
    <a class="lg-back" id="lg-back" href="/"><span aria-hidden="true">←</span> <b style="font-weight:400" data-t="back">Torna al sito</b></a>
    <div class="lg-lang" role="group" aria-label="Lingua / Language">
      <button type="button" data-lang="it" lang="it" aria-pressed="true">IT</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="lg-card">
    <div class="lg-side">
      <canvas class="lg-rain" id="lg-rain" aria-hidden="true"></canvas>
      <a class="lg-logo" id="lg-logo" href="/" aria-label="ARGO">
        <svg viewBox="0 0 3406 801" aria-hidden="true" focusable="false">
          <g transform="translate(0,0)"><path class="lg-d" d="M629,3 L826,383 L579,383 L508,261 Z"/><path class="lg-d" d="M414,450 L606,450 L690,620 L331,619 Z"/><path class="lg-l" d="M366.5,69.1 Q400,2 475.0,1.4 L638,0 L279.9,732.6 Q247,800 172.0,800.3 L1,801 Z"/><path class="lg-l" d="M607,449 L859,449 L1031,800 L855.0,800.0 Q780,800 746.9,732.7 L693,623 Z"/></g>
          <g transform="translate(1161,0)"><path class="lg-l" d="M0.0,70.0 Q0,0 70.0,0.0 L165,0 L165,800 L0,800 Z"/><path class="lg-d" d="M165,0 L500,0 L403,165 L165,165 Z"/><path class="lg-l" d="M500,0 L595.0,0.0 Q665,0 629.4,60.3 L405,440 L240,440 Z"/><path class="lg-d" d="M240,440 L405,440 L605,800 L510.0,800.0 Q440,800 406.0,738.8 Z"/></g>
          <g transform="translate(1956,0)"><path class="lg-l" d="M0.0,70.0 Q0,0 70.0,0.0 L165,0 L165,635 L0,800 Z"/><path class="lg-d" d="M165,0 L590.0,0.0 Q660,0 610.5,49.5 L495,165 L165,165 Z"/><path class="lg-d" d="M0,800 L165,635 L660,635 L660,800 Z"/><path class="lg-l" d="M495,380 L660,380 L660,635 L495,800 Z"/><path class="lg-l" d="M400.0,450.0 Q400,380 470.0,380.0 L660,380 L660,545 L400,545 Z"/></g>
          <g transform="translate(2746,0)"><path class="lg-l" d="M0.0,70.0 Q0,0 70.0,0.0 L165,0 L165,635 L0,800 Z"/><path class="lg-d" d="M165,0 L660,0 L495,165 L165,165 Z"/><path class="lg-d" d="M0,800 L165,635 L496,635 L496,800 Z"/><path class="lg-l" d="M495,165 L660,0 L660.0,730.0 Q660,800 590.0,800.0 L495,800 Z"/></g>
        </svg>
      </a>
      <p class="lg-panel" data-t="panel">Il motore di lettura documenti di One Tech</p>
      <div class="scan" id="lg-scan" aria-hidden="true">
        <div class="scan-head"><span class="scan-dot"></span><span data-t="scanLabel">Scansione documento</span><span class="scan-count" id="lg-scan-count">01/05</span></div>
        <div class="scan-body" id="lg-scan-body"></div>
      </div>
    </div>

    <div class="lg-main">
      <h1 data-t="title">Accedi</h1>
      <p class="lg-sub" data-t="subtitle">Accedi con il tuo account ARGO.</p>

      <form class="lg-form" id="lg-form" novalidate>
        <div class="lg-field">
          <label for="lg-email" data-t="email">Email</label>
          <input id="lg-email" type="email" name="email" autocomplete="username" inputmode="email" data-ph="emailPh" placeholder="nome@azienda.it" aria-describedby="lg-email-err">
          <p class="lg-err" id="lg-email-err" hidden></p>
        </div>

        <div class="lg-field">
          <label for="lg-password" data-t="password">Password</label>
          <div class="lg-pass">
            <input id="lg-password" type="password" name="password" autocomplete="current-password" data-ph="passwordPh" placeholder="La tua password" aria-describedby="lg-password-err">
            <button type="button" class="lg-eye" id="lg-eye" aria-pressed="false" aria-label="Mostra password">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
                <path class="slash" d="M4 20L20 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="lg-err" id="lg-password-err" hidden></p>
        </div>

        <a class="lg-forgot" id="lg-forgot" href="#" data-t="forgot">Password dimenticata?</a>

        <p class="lg-msg" id="lg-msg" role="alert" hidden></p>

        <button type="submit" class="lg-submit" id="lg-submit">
          <span data-t="submit">Accedi</span>
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 10h11M11 5.5l4.5 4.5-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <p class="lg-alt"><span data-t="noAccount">Non hai un account?</span> <a id="lg-contact" href="/#richiedi-demo" data-t="contact">Parla con noi</a></p>
    </div>
  </div>
</main>

<script>
(function () {
  /* ================= configurazione ================= */
  var SITE_URL = "/";                       /* es. "https://argo.otech.one/" */
  var LOGIN_ENDPOINT = "";                  /* es. "https://app.argo.otech.one/api/login" */
  var SUPPORT_EMAIL = "sales@otech.one";

  /* ================= testi IT / EN ================= */
  var TEXT = {
    it: {
      title: "Accedi", subtitle: "Accedi con il tuo account ARGO.", panel: "Il motore di lettura documenti di One Tech", scanLabel: "Scansione documento", scanDone: "Letto", docs: [["Busta paga",[["Dipendente","Mario Rossi"],["Periodo","08/2026"],["Lordo","€ 2.400,00"],["Netto","€ 1.780,00"]]],["Documento d’identità",[["Nome","Mario Rossi"],["Nato il","14/03/1981"],["Numero","CA12345XY"],["Scadenza","14/03/2031"]]],["Contratto",[["Parti","Beta Spa"],["Oggetto","Locazione"],["Durata","4 + 4 anni"],["Canone","€ 900,00"]]],["Fattura",[["Fornitore","Alfa Srl"],["Numero","2026/0412"],["Imponibile","€ 1.250,00"],["IVA","22%"]]],["Modello OBIS-M",[["Pensionato","Anna Bianchi"],["Anno","2026"],["Lordo mensile","€ 1.620,00"],["Netto mensile","€ 1.340,00"]]]],
      email: "Email", emailPh: "nome@azienda.it", password: "Password", passwordPh: "La tua password",
      show: "Mostra password", hide: "Nascondi password", submit: "Accedi", sending: "Accesso in corso…",
      forgot: "Password dimenticata?", noAccount: "Non hai un account?", contact: "Parla con noi", back: "Torna al sito",
      pageTitle: "Accedi | ARGO · One Tech",
      errEmail: "Inserisci un indirizzo email valido.", errPassword: "Inserisci la password.",

    },
    en: {
      title: "Log in", subtitle: "Sign in with your ARGO account.", panel: "One Tech’s document-reading engine", scanLabel: "Scanning document", scanDone: "Read", docs: [["Payslip",[["Employee","Mario Rossi"],["Period","08/2026"],["Gross","€2,400.00"],["Net","€1,780.00"]]],["ID document",[["Name","Mario Rossi"],["Born on","14/03/1981"],["Number","CA12345XY"],["Expiry","14/03/2031"]]],["Contract",[["Party","Beta Spa"],["Subject","Lease"],["Term","4 + 4 years"],["Rent","€900.00"]]],["Invoice",[["Supplier","Alfa Srl"],["Number","2026/0412"],["Taxable","€1,250.00"],["VAT","22%"]]],["OBIS-M form",[["Pensioner","Anna Bianchi"],["Year","2026"],["Monthly gross","€1,620.00"],["Monthly net","€1,340.00"]]]],
      email: "Email", emailPh: "name@company.com", password: "Password", passwordPh: "Your password",
      show: "Show password", hide: "Hide password", submit: "Log in", sending: "Signing in…",
      forgot: "Forgot your password?", noAccount: "Don’t have an account?", contact: "Talk with us", back: "Back to the website",

      errEmail: "Enter a valid email address.", errPassword: "Enter your password.",

      failed: "Incorrect email or password.", network: "Connection problem. Please try again in a moment."

  };

  var $ = function (id) { return document.getElementById(id); };
  var form = $("lg-form"), email = $("lg-email"), pass = $("lg-password"), eye = $("lg-eye");
  var msg = $("lg-msg"), submitBtn = $("lg-submit");
  var lang = document.documentElement.lang === "en" ? "en" : "it";
  var t = TEXT[lang];

  /* link verso il sito */
  $("lg-back").href = SITE_URL;
  $("lg-logo").href = SITE_URL;
  $("lg-contact").href = SITE_URL.replace(/\/?$/, "/") + "#richiedi-demo";

  function applyLang(l) {
    lang = l; t = TEXT[l];
    document.documentElement.lang = l;
    document.title = t.pageTitle;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
    document.querySelectorAll("[data-ph]").forEach(function (el) { el.placeholder = t[el.getAttribute("data-ph")]; });
    document.querySelectorAll(".lg-lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l)); });
    eye.setAttribute("aria-label", pass.type === "text" ? t.hide : t.show);
    $("lg-forgot").href = "mailto:" + SUPPORT_EMAIL + "?subject=" + encodeURIComponent(t.forgot + " · ARGO");
    /* messaggi già visibili: ritradotti */
    if (!$("lg-email-err").hidden) showErr(email, "lg-email-err", t.errEmail);
    if (!$("lg-password-err").hidden) showErr(pass, "lg-password-err", t.errPassword);
    msg.hidden = true;
    if (scanBody) renderScan();                 /* lo scanner passa ai documenti nella nuova lingua */
  }
  document.querySelectorAll(".lg-lang button").forEach(function (b) {
    b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); });
  });

  /* ================= validazione e invio ================= */
  var isEmail = function (v) { return /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v); };
  function showErr(input, id, text) { var p = $(id); p.textContent = text; p.hidden = false; input.setAttribute("aria-invalid", "true"); }
  function clearErr(input, id) { $(id).hidden = true; input.removeAttribute("aria-invalid"); }
  email.addEventListener("input", function () { clearErr(email, "lg-email-err"); });
  pass.addEventListener("input", function () { clearErr(pass, "lg-password-err"); });

  eye.addEventListener("click", function () {
    var showing = pass.type === "password";
    pass.type = showing ? "text" : "password";
    eye.setAttribute("aria-pressed", String(showing));
    eye.setAttribute("aria-label", showing ? t.hide : t.show);
  });

  function setSending(on) {
    submitBtn.disabled = on;
    submitBtn.querySelector("[data-t]").textContent = on ? t.sending : t.submit;
  }
  function say(text) { msg.textContent = text; msg.hidden = false; }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    msg.hidden = true;
    var okEmail = isEmail(email.value.trim()), okPass = pass.value.length > 0;
    if (!okEmail) showErr(email, "lg-email-err", t.errEmail); else clearErr(email, "lg-email-err");
    if (!okPass) showErr(pass, "lg-password-err", t.errPassword); else clearErr(pass, "lg-password-err");
    if (!okEmail) { email.focus(); return; }
    if (!okPass) { pass.focus(); return; }

    if (!LOGIN_ENDPOINT) { say(t.notReady); return; }
    setSending(true);
    fetch(LOGIN_ENDPOINT, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ email: email.value.trim(), password: pass.value })
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (out) {
        if (res.ok && out && out.ok) { window.location.href = out.redirect || SITE_URL; return; }
        setSending(false);
        say(res.status === 401 || res.status === 403 || (out && out.reason === "failed") ? t.failed : out && out.reason === "not_configured" ? t.notReady : t.network);
      });
    }).catch(function () { setSending(false); say(t.network); });
  });

  /* ================= scanner del documento (sotto il logo) ================= */
  var LINES = [92, 70, 84, 58, 88, 64, 76];          /* larghezze (%) delle righe del foglio */
  var scanIdx = 0, scanBody = $("lg-scan-body"), scanCount = $("lg-scan-count");
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function renderScan() {
    var docs = t.docs, d = docs[scanIdx % docs.length];
    scanCount.textContent = pad(scanIdx % docs.length + 1) + "/" + pad(docs.length);
    /* un riquadro nuovo a ogni documento: le animazioni CSS ripartono da capo */
    var body = el("div", "scan-body"); body.id = "lg-scan-body";
    var doc = el("div", "scan-doc");
    ["tl", "tr", "bl", "br"].forEach(function (c) { doc.appendChild(el("i", "scan-c " + c)); });
    var paper = el("div", "scan-paper");
    paper.appendChild(el("b", null, d[0].replace(/-/g, "‑")));   /* "OBIS-M" non si spezza */
    LINES.forEach(function (w, k) { var s = el("span", "scan-line"); s.style.width = w + "%"; s.style.setProperty("--k", k); paper.appendChild(s); });
    paper.appendChild(el("span", "scan-beam"));
    doc.appendChild(paper); body.appendChild(doc);
    var dl = el("dl", "scan-fields");
    d[1].slice(0, 3).forEach(function (f, n) { var row = el("div"); row.style.setProperty("--n", n); row.appendChild(el("dt", null, f[0])); row.appendChild(el("dd", null, f[1])); dl.appendChild(row); });
    dl.appendChild(el("p", "scan-ok", "✓ " + t.scanDone));
    body.appendChild(dl);
    scanBody.replaceWith(body); scanBody = body;
  }
  if (!matchMedia("(prefers-reduced-motion:reduce)").matches) {
    setInterval(function () { if (!document.hidden) { scanIdx++; renderScan(); } }, 5200);
  }

  applyLang(lang);

  /* ================= pioggia Matrix (come il blocco ARGO+) ================= */
  var canvas = $("lg-rain"), ctx = canvas.getContext("2d");
  var GLYPHS = "01".repeat(14) + "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var BG = "7,17,12";                       /* = fondo del pannello (#07110c) */
  var V = { size: 14, step: 16, tick: 55, head: "#c9f7dc", trail: "#1f9d5a", accent: "#d4f25a" };
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var w = 0, h = 0, drops = [], raf = 0, last = 0, visible = true;
  var font = getComputedStyle(document.body).fontFamily;

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "rgb(" + BG + ")"; ctx.fillRect(0, 0, w, h);
    drops = Array.from({ length: Math.ceil(w / V.step) }, function () { return Math.floor(Math.random() * -(h / V.step)); });
  }
  function step() {
    ctx.fillStyle = "rgba(" + BG + ",.14)"; ctx.fillRect(0, 0, w, h);
    ctx.font = V.size + "px " + font; ctx.textBaseline = "top";
    for (var i = 0; i < drops.length; i++) {
      var y = drops[i] * V.step;
      if (y >= 0) {
        var r = Math.random();
        ctx.fillStyle = r > .985 ? V.accent : r > .55 ? V.head : V.trail;
        ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], i * V.step + 2, y);
      }
      if (y > h && Math.random() > .972) drops[i] = Math.floor(Math.random() * -12);
      else drops[i]++;
    }
  }
  function loop(now) {
    if (now - last > V.tick) { last = now; step(); }
    raf = requestAnimationFrame(loop);
  }
  function play() {
    cancelAnimationFrame(raf);
    if (visible && !document.hidden && !reduce) raf = requestAnimationFrame(loop);
  }
  resize();
  if (reduce) for (var k = 0; k < 80; k++) step();     /* movimento ridotto: un'immagine ferma */
  new ResizeObserver(function () { resize(); if (reduce) for (var k = 0; k < 80; k++) step(); }).observe(canvas);
  new IntersectionObserver(function (e) { visible = e[0].isIntersecting; play(); }).observe(canvas);
  document.addEventListener("visibilitychange", play);
  /* il carattere DM Mono arriva dopo: la pioggia lo usa appena è pronto */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { font = getComputedStyle(document.body).fontFamily; });
})();
</script>
</body>
</html>
